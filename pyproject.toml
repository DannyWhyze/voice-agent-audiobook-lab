[project]
name = "fishaudio-s2-pro"
version = "0.1.0"
description = "Local client for a self-hosted fishaudio/s2-pro TTS server (vLLM-omni or native PyTorch, via Podman)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=0.27.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "langchain-ollama>=1.1.0",
    "langchain>=1.3.14",
    "pyloudnorm>=0.2.0",
    "deepagents>=0.7.4",
    "librosa>=0.11.0",
    "pyworld>=0.3.5",
    "scipy>=1.18.0",
    "numba>=0.66.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "lameenc>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "pyinstaller>=6.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
